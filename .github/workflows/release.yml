name: release

# Builds and packs the CLI on every tag matching `v*`. Attaches the resulting
# `daedalus-<version>.tgz` to the GitHub Release. Users install with:
#   npm install -g https://github.com/inline-studio/daedalus-/releases/download/vX.Y.Z/daedalus-X.Y.Z.tgz
# (or download the tarball and `npm i -g ./daedalus-X.Y.Z.tgz`).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke tests (CI scope)
        env:
          DAE_TEST_SCOPE: ci
        run: npm test

      - name: Pack tarball
        run: npm pack

      - name: List tarball
        run: ls -la *.tgz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: 'daedalus-*.tgz'
          generate_release_notes: true
          draft: false
          prerelease: false
