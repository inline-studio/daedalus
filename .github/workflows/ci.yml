name: CI

# Runs tests on every push and PR.
# On a push to main, stamps the version as {base}-{run_number} (e.g. 0.1.0-42),
# packs, and publishes a GitHub Release. Every push to main produces a new release.
# The release always includes daedalus-latest.tgz for a permanent versionless install URL:
#   npm install -g https://github.com/inline-studio/daedalus/releases/latest/download/daedalus-latest.tgz

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke tests (CI scope)
        env:
          DAE_TEST_SCOPE: ci
        run: npm test

      # --- Release steps: main branch pushes only ---

      - name: Stamp build version
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          BASE=$(node -p "require('./package.json').version.replace(/-\d+$/, '')")
          npm pkg set version="${BASE}-${{ github.run_number }}"

      - name: Read version
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Pack tarball
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          npm pack
          cp daedalus-*.tgz daedalus-latest.tgz

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          files: |
            daedalus-*.tgz
            daedalus-latest.tgz
          generate_release_notes: true
          draft: false
          prerelease: false
