# Reference docker-compose for running daedalus in "docker mode".
#
# Architecture:
#   - daedalus     — supervisor + scheduler (long-lived `dae serve`). With
#                    runtime.persistentAgent it routes each top-level turn to dae-worker;
#                    otherwise it spawns one agent container per message via the socket.
#   - dae-worker   — long-lived "warm" agent worker (`dae agent-worker`). Keeps OneCLI +
#                    MCP connections warm and serves top-level turns over HTTP, so each
#                    message skips the container cold-start. Spawns its subagents as
#                    ephemeral containers. Isolated from the supervisor's channel tokens.
#   - graphiti     — knowledge-graph memory MCP (FalkorDB + MCP; `graphiti` profile).
#   - whisper      — local speech-to-text (optional; `whisper` profile only).
#   - onecli       — credential gateway (+ onecli-db postgres). Comment both out if you
#                    run OneCLI externally instead.
#
# All services join the `daedalus` network so they reach each other by container name
# (e.g. http://onecli:10254, http://graphiti:8000/mcp/). Agent containers spawned by the
# supervisor join the same network — their HTTPS_PROXY ends up pointing at the OneCLI
# service name rather than `host.docker.internal`.
#
# Bring up: `docker compose up -d`                       (core: daedalus + onecli)
#           `docker compose --profile whisper up -d`     (also local whisper STT)
# Logs:     `docker compose logs -f daedalus`
#
# Easiest path is `dae install`, which writes the .env below and runs compose for you.

name: daedalus

services:
  # Populates the shared `dae-runtime` named volume with the Node binary +
  # daedalus install from the daedalus image. Runs once at `docker compose up`
  # and exits. The supervisor and every per-agent container then mount this
  # volume so user-provided agent images don't need Node/daedalus baked in.
  # See docs/docker-mode.md for the glibc compatibility note.
  dae-runtime-init:
    image: ${DAEDALUS_IMAGE:-ghcr.io/inline-studio/daedalus:latest}
    build:
      context: .
      args:
        DAEDALUS_VERSION: ${DAEDALUS_VERSION:-latest}
    # Two jobs, both needing root (so no `user:` override):
    #   1. Populate the injectable runtime volume from the image's /dae-runtime.
    #   2. chown the data + shared volumes to ${UID} — named volumes are root-owned
    #      on first create, but the supervisor + agents run as ${UID}, so without
    #      this they can't write sessions.sqlite / the shared workspace on any host
    #      whose uid isn't the image default.
    command:
      - "sh"
      - "-c"
      - "rm -rf /runtime/* && cp -RL /dae-runtime/. /runtime/ && chown -R ${UID:-1000} /data /shared && echo 'runtime populated + data/shared chowned to ${UID:-1000}'"
    volumes:
      - dae-runtime:/runtime
      - daedalus-data:/data
      - daedalus-shared:/shared
    restart: "no"

  daedalus:
    image: ${DAEDALUS_IMAGE:-ghcr.io/inline-studio/daedalus:latest}
    # Build locally with `docker compose build daedalus` if you want a from-source image.
    build:
      context: .
      args:
        DAEDALUS_VERSION: ${DAEDALUS_VERSION:-latest}
    restart: unless-stopped
    init: true
    environment:
      DAE_CONFIG: /etc/daedalus/config.yaml
      # OneCLI bootstrap — the gateway runs as the `onecli` service. When you supply a
      # daemon API key (dae install asks for it), the supervisor uses it to fetch the
      # gateway bundle at startup and forwards it into each agent container via
      # ContainerAgentDispatcher. Optional: leave unset to run with OneCLI disabled.
      ONECLI_API_KEY: ${ONECLI_API_KEY:-}
      # Tells the supervisor to spawn each agent turn as its own container (vs
      # in-process), and lets it pass the right network name + image into them.
      DAE_DISPATCHER: container
      DAE_AGENT_IMAGE_DEFAULT: ${DAEDALUS_IMAGE:-ghcr.io/inline-studio/daedalus:latest}
      DAE_AGENT_NETWORK: daedalus
      # Host-side paths/volumes the dispatcher bind-mounts into each spawned agent
      # container. Bind mounts via docker.sock are resolved by the host daemon, not
      # this container — so the supervisor must know the real host paths (brain,
      # config dir) and the named volumes (shared, data, prefixed with the compose
      # project name `daedalus_`). Without these, nested agent dispatch would try to
      # mount the supervisor's own /brain etc. and fail.
      DAE_AGENT_HOST_BRAIN: ${BRAIN_PATH:?set BRAIN_PATH in .env}
      DAE_AGENT_HOST_CONFIG: ${DAEDALUS_CONFIG_DIR:?set DAEDALUS_CONFIG_DIR in .env}
      DAE_AGENT_HOST_SHARED: daedalus_daedalus-shared
      DAE_AGENT_HOST_DATA: daedalus_daedalus-data
      # Name of the docker volume the agent runtime lives in. The dispatcher
      # mounts this into each spawned agent container at /dae-runtime so user
      # images can be free of Node/daedalus installs.
      DAE_AGENT_RUNTIME_VOLUME: daedalus_dae-runtime
      # Where the long-lived warm agent worker listens. When the config has
      # runtime.persistentAgent: true (dae install sets this), the supervisor sends
      # each top-level turn here instead of spawning a container per message.
      DAE_WORKER_URL: http://dae-worker:10260
    volumes:
      # Brain (the agent personas + skills + souls + mcp config). Mount RO by default.
      - ${BRAIN_PATH:?set BRAIN_PATH in .env}:/brain:ro
      # Per-config dir mount (config.yaml, .env.local). RO.
      - ${DAEDALUS_CONFIG_DIR:?set DAEDALUS_CONFIG_DIR in .env}:/etc/daedalus:ro
      # Persistent state: sessions sqlite, attachments. Owned by the dae user inside.
      - daedalus-data:/data
      # Shared workspace, RW for every agent. The cross-agent scratch space.
      - daedalus-shared:/shared
      # Docker socket so the supervisor can `docker run` per-agent containers.
      - /var/run/docker.sock:/var/run/docker.sock
    # Web chat UI + channel API — only meaningful when channels.web is enabled (port 8765
    # by default). Loopback-published so nothing on your LAN reaches it directly; front it
    # with your OWN reverse proxy for TLS + auth (daedalus bundles none). Set WEB_BIND to an
    # interface your proxy can reach (e.g. 0.0.0.0) if it runs on another host.
    ports:
      - "${WEB_BIND:-127.0.0.1}:8765:8765"
    networks:
      - daedalus
    depends_on:
      # Wait until onecli's gateway is actually accepting requests, not just until
      # the container exists — the supervisor fetches its OneCLI bundle once at
      # startup, and onecli isn't ready until postgres is healthy + migrations run.
      onecli:
        condition: service_healthy
      dae-runtime-init:
        condition: service_completed_successfully
      # The warm agent worker handles every top-level turn — wait until it's serving
      # so the first inbound message doesn't race its startup.
      dae-worker:
        condition: service_healthy
    # Run as the host UID/GID so bind-mounted brain files stay owned by the host user.
    # Adjust if your host UID isn't 1000.
    user: "${UID:-1000}:${DOCKER_GID:-998}"

  # Long-lived "warm" agent worker. Same image as the supervisor but runs
  # `dae agent-worker`: it applies OneCLI once and keeps MCP connections in a
  # persistent pool, then serves each top-level turn over HTTP (http://dae-worker:10260)
  # for the supervisor's persistent dispatcher. Subagents it spawns still get their own
  # ephemeral containers (DAE_DISPATCHER=container + the docker socket below). Isolated
  # from the supervisor: it never sees the channel tokens, and a crash here doesn't take
  # the supervisor (and your channels) down — compose just restarts it.
  dae-worker:
    image: ${DAEDALUS_IMAGE:-ghcr.io/inline-studio/daedalus:latest}
    build:
      context: .
      args:
        DAEDALUS_VERSION: ${DAEDALUS_VERSION:-latest}
    command: ["dae", "agent-worker"]
    restart: unless-stopped
    init: true
    environment:
      DAE_CONFIG: /etc/daedalus/config.yaml
      ONECLI_API_KEY: ${ONECLI_API_KEY:-}
      # Subagents the worker spawns run as their own ephemeral containers.
      DAE_DISPATCHER: container
      DAE_AGENT_IMAGE_DEFAULT: ${DAEDALUS_IMAGE:-ghcr.io/inline-studio/daedalus:latest}
      DAE_AGENT_NETWORK: daedalus
      DAE_AGENT_HOST_BRAIN: ${BRAIN_PATH:?set BRAIN_PATH in .env}
      DAE_AGENT_HOST_CONFIG: ${DAEDALUS_CONFIG_DIR:?set DAEDALUS_CONFIG_DIR in .env}
      DAE_AGENT_HOST_SHARED: daedalus_daedalus-shared
      DAE_AGENT_HOST_DATA: daedalus_daedalus-data
      DAE_AGENT_RUNTIME_VOLUME: daedalus_dae-runtime
    volumes:
      - ${BRAIN_PATH:?set BRAIN_PATH in .env}:/brain:ro
      - ${DAEDALUS_CONFIG_DIR:?set DAEDALUS_CONFIG_DIR in .env}:/etc/daedalus:ro
      - daedalus-data:/data
      - daedalus-shared:/shared
      # Docker socket so the worker can `docker run` per-subagent containers.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:10260/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - daedalus
    depends_on:
      onecli:
        condition: service_healthy
      dae-runtime-init:
        condition: service_completed_successfully
    user: "${UID:-1000}:${DOCKER_GID:-998}"

  # Graphiti temporal-knowledge-graph memory (bundled FalkorDB + MCP server in one
  # container), built from Dockerfile.graphiti (a thin layer over Zep's image — see that
  # file for the why). Opt-in via the `graphiti` compose profile + memory.backend: graphiti.
  # Extraction LLM + embeddings run on your spark, reached THROUGH the OneCLI proxy (so the
  # spark key is never on disk — OneCLI injects it). The graph store is local and portable —
  # bind-mount GRAPHITI_DATA_PATH to back it up / move it to another host (then reindex).
  graphiti:
    build:
      context: .
      dockerfile: Dockerfile.graphiti
    image: ${GRAPHITI_IMAGE:-daedalus-graphiti:local}
    restart: unless-stopped
    profiles: ["graphiti"]
    environment:
      # SPARK_URL is your OpenAI-compatible base URL (incl. /v1). graphiti reaches it via
      # the OneCLI proxy; the api key is a placeholder that OneCLI swaps for the real one.
      # Soft default so compose interpolation never errors when graphiti isn't in the
      # active profile; `dae install` always sets it when graphiti IS enabled.
      SPARK_URL: ${SPARK_URL:-}
      # graphiti-core builds its cross-encoder/reranker client itself from these env vars —
      # point them at spark too so nothing ever falls back to api.openai.com. Placeholder
      # key; OneCLI injects the real one for the spark host.
      OPENAI_BASE_URL: ${SPARK_URL}
      OPENAI_API_KEY: onecli-managed
      GRAPHITI_LLM_MODEL: ${GRAPHITI_LLM_MODEL:-artemis}
      GRAPHITI_EMBED_MODEL: ${GRAPHITI_EMBED_MODEL:-embeddings}
      GRAPHITI_EMBED_DIM: ${GRAPHITI_EMBED_DIM:-768}
      # graphiti-core ships PostHog telemetry ON by default — disabled (also baked into the image).
      GRAPHITI_TELEMETRY_ENABLED: "false"
      # Route egress through the OneCLI proxy (it injects the spark key). `dae install` sets
      # ONECLI_PROXY_URL after onecli is up. NO_PROXY keeps loopback + the proxy itself direct.
      HTTP_PROXY: ${ONECLI_PROXY_URL:-}
      HTTPS_PROXY: ${ONECLI_PROXY_URL:-}
      http_proxy: ${ONECLI_PROXY_URL:-}
      https_proxy: ${ONECLI_PROXY_URL:-}
      NO_PROXY: "localhost,127.0.0.1,onecli"
      no_proxy: "localhost,127.0.0.1,onecli"
      CONFIG_PATH: /app/mcp/config/config.yaml
      # spark is CPU-constrained — keep episode-processing concurrency low.
      SEMAPHORE_LIMIT: ${GRAPHITI_SEMAPHORE_LIMIT:-3}
      BROWSER: "0" # disable the FalkorDB web UI
    volumes:
      - ${GRAPHITI_DATA_PATH:-graphiti-data}:/var/lib/falkordb/data
      - ./graphiti.config.yaml:/app/mcp/config/config.yaml:ro
      # OneCLI MITM CA so graphiti's Python client trusts the proxy. Written by `dae install`.
      - ${ONECLI_CA_PATH:-./onecli-ca.pem}:/certs/onecli-ca.pem:ro
    depends_on:
      onecli:
        condition: service_healthy
    networks:
      - daedalus

  # Local speech-to-text (Whisper), for transcribing voice notes. Optional — only
  # started with the `whisper` compose profile, which `dae install` enables when you
  # opt into local transcription (otherwise this service is skipped entirely).
  # Internal-only: the supervisor reaches it by container name (http://whisper:8000/v1)
  # on the daedalus network. We deliberately DON'T publish a host port — nothing on
  # the host needs it, and publishing 8000 just collides with whatever else is there.
  whisper:
    image: ${WHISPER_IMAGE:-ghcr.io/speaches-ai/speaches:latest-cpu}
    restart: unless-stopped
    profiles: ["whisper"]
    environment:
      # CPU can't do float16; without this speaches falls back to float32 (very slow —
      # minutes per voice note). int8 quantisation is dramatically faster on CPU.
      WHISPER__COMPUTE_TYPE: int8
    networks:
      - daedalus

  # OneCLI credential gateway — part of the stack. daedalus reaches it by service
  # name (http://onecli:10254). Set `onecli.baseUrl: http://onecli:10254` +
  # onecli.enabled in your config (dae install does this when you supply a key) and
  # put the daemon API key in ONECLI_API_KEY in .env. The loopback publish lets the
  # host (`dae setup onecli`) reach it too.
  onecli:
    image: ${ONECLI_IMAGE:-ghcr.io/onecli/onecli:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:10254:10254"
      - "127.0.0.1:10255:10255"
    environment:
      DATABASE_URL: postgresql://onecli:onecli@onecli-db:5432/onecli
    # Wait until postgres ACCEPTS CONNECTIONS, not just until the container starts.
    # onecli runs prisma migrations at boot; if the DB isn't reachable yet it
    # mis-bootstraps the baseline migration and then crash-loops (relation does not
    # exist), so service_healthy here is required, not just nice-to-have.
    depends_on:
      onecli-db:
        condition: service_healthy
    networks:
      - daedalus

  onecli-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: onecli
      POSTGRES_PASSWORD: onecli
      POSTGRES_DB: onecli
    volumes:
      - onecli-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onecli -d onecli"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - daedalus

volumes:
  daedalus-data:
  daedalus-shared:
  graphiti-data:
  # Holds the injectable agent runtime (node binary + daedalus install).
  # Populated by dae-runtime-init at startup; mounted ro into every per-agent
  # container so they don't need Node/daedalus pre-installed.
  dae-runtime:
  onecli-pgdata:

networks:
  daedalus:
    name: daedalus
    driver: bridge
