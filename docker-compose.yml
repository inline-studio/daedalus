# Reference docker-compose for running daedalus in "docker mode".
#
# Architecture:
#   - daedalus     — supervisor + scheduler (long-lived `dae serve`); spawns one agent
#                    container per inbound message via the mounted docker socket.
#   - mempalace    — shared HTTP-MCP memory store every agent connects to.
#   - whisper      — local speech-to-text (optional; `whisper` profile only).
#   - onecli       — credential gateway (+ onecli-db postgres). Comment both out if you
#                    run OneCLI externally instead.
#
# All services join the `daedalus` network so they reach each other by container name
# (e.g. http://onecli:10254, http://mempalace:11364). Agent containers spawned by the
# supervisor join the same network — their HTTPS_PROXY ends up pointing at the OneCLI
# service name rather than `host.docker.internal`.
#
# Bring up: `docker compose up -d`                       (core: daedalus + mempalace)
#           `docker compose --profile whisper up -d`     (also local whisper STT)
# Logs:     `docker compose logs -f daedalus`
#
# Easiest path is `dae install`, which writes the .env below and runs compose for you.

name: daedalus

services:
  # Populates the shared `dae-runtime` named volume with the Node binary +
  # daedalus install from the daedalus image. Runs once at `docker compose up`
  # and exits. The supervisor and every per-agent container then mount this
  # volume so user-provided agent images don't need Node/daedalus baked in.
  # See docs/docker-mode.md for the glibc compatibility note.
  dae-runtime-init:
    image: ${DAEDALUS_IMAGE:-ghcr.io/inline-studio/daedalus:latest}
    build:
      context: .
      args:
        DAEDALUS_VERSION: ${DAEDALUS_VERSION:-latest}
    command: ["sh", "-c", "rm -rf /shared/* && cp -RL /dae-runtime/. /shared/ && echo 'dae-runtime volume populated'"]
    volumes:
      - dae-runtime:/shared
    restart: "no"

  daedalus:
    image: ${DAEDALUS_IMAGE:-ghcr.io/inline-studio/daedalus:latest}
    # Build locally with `docker compose build daedalus` if you want a from-source image.
    build:
      context: .
      args:
        DAEDALUS_VERSION: ${DAEDALUS_VERSION:-latest}
    restart: unless-stopped
    init: true
    environment:
      DAE_CONFIG: /etc/daedalus/config.yaml
      # OneCLI bootstrap — the gateway runs as the `onecli` service. When you supply a
      # daemon API key (dae install asks for it), the supervisor uses it to fetch the
      # gateway bundle at startup and forwards it into each agent container via
      # ContainerAgentDispatcher. Optional: leave unset to run with OneCLI disabled.
      ONECLI_API_KEY: ${ONECLI_API_KEY:-}
      # Bearer token for the mempalace MCP. When set, the supervisor adds it to the
      # auto-injected `memory` server and forwards it into every agent container.
      MEMPALACE_TOKEN: ${MEMPALACE_TOKEN:-}
      # Tells the supervisor we're in docker mode and lets it pass the right network
      # name + supervisor image into the agent containers it spawns.
      DAE_DISPATCHER: docker
      DAE_AGENT_IMAGE_DEFAULT: ${DAEDALUS_IMAGE:-ghcr.io/inline-studio/daedalus:latest}
      DAE_AGENT_NETWORK: daedalus
      # Host-side paths/volumes the dispatcher bind-mounts into each spawned agent
      # container. Bind mounts via docker.sock are resolved by the host daemon, not
      # this container — so the supervisor must know the real host paths (brain,
      # config dir) and the named volumes (shared, data, prefixed with the compose
      # project name `daedalus_`). Without these, nested agent dispatch would try to
      # mount the supervisor's own /brain etc. and fail.
      DAE_AGENT_HOST_BRAIN: ${BRAIN_PATH:?set BRAIN_PATH in .env}
      DAE_AGENT_HOST_CONFIG: ${DAEDALUS_CONFIG_DIR:?set DAEDALUS_CONFIG_DIR in .env}
      DAE_AGENT_HOST_SHARED: daedalus_daedalus-shared
      DAE_AGENT_HOST_DATA: daedalus_daedalus-data
      # Name of the docker volume the agent runtime lives in. The dispatcher
      # mounts this into each spawned agent container at /dae-runtime so user
      # images can be free of Node/daedalus installs.
      DAE_AGENT_RUNTIME_VOLUME: daedalus_dae-runtime
    volumes:
      # Brain (the agent personas + skills + souls + mcp config). Mount RO by default.
      - ${BRAIN_PATH:?set BRAIN_PATH in .env}:/brain:ro
      # Per-config dir mount (config.yaml, .env.local). RO.
      - ${DAEDALUS_CONFIG_DIR:?set DAEDALUS_CONFIG_DIR in .env}:/etc/daedalus:ro
      # Persistent state: sessions sqlite, attachments. Owned by the dae user inside.
      - daedalus-data:/data
      # Shared workspace, RW for every agent. The cross-agent scratch space.
      - daedalus-shared:/shared
      # Docker socket so the supervisor can `docker run` per-agent containers.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - daedalus
    depends_on:
      mempalace:
        condition: service_started
      onecli:
        condition: service_started
      dae-runtime-init:
        condition: service_completed_successfully
    # Run as the host UID/GID so bind-mounted brain files stay owned by the host user.
    # Adjust if your host UID isn't 1000.
    user: "${UID:-1000}:${DOCKER_GID:-998}"

  # Shared memory MCP every agent connects to (http://mempalace:11364/sse).
  # MemPalace's own MCP server is stdio-only, so the image fronts it with mcp-proxy
  # (see Dockerfile.mempalace). The palace (on-disk store) is bind-mounted so it
  # persists and the container stays stateless: set MEMPALACE_PALACE_PATH in .env to
  # your host palace dir (e.g. /home/you/.daedalus/mempalace). If unset, a named
  # volume (mempalace-data) is used instead.
  mempalace:
    image: ${MEMPALACE_IMAGE:-ghcr.io/inline-studio/mempalace-mcp:latest}
    build:
      context: .
      dockerfile: Dockerfile.mempalace
    restart: unless-stopped
    # Loopback publish so the host (`dae run`) can also reach it; agents reach it by
    # container name (`mempalace`) on the daedalus network regardless of this.
    ports:
      - "127.0.0.1:11364:11364"
    volumes:
      - ${MEMPALACE_PALACE_PATH:-mempalace-data}:/palace
    networks:
      - daedalus

  # Local speech-to-text (Whisper), for transcribing voice notes. Optional — only
  # started with the `whisper` compose profile, which `dae install` enables when you
  # opt into local transcription (otherwise this service is skipped entirely).
  # The supervisor + agents reach it by container name (http://whisper:8000/v1); the
  # loopback publish lets the host (`dae run`) reach it too.
  whisper:
    image: ${WHISPER_IMAGE:-ghcr.io/speaches-ai/speaches:latest-cpu}
    restart: unless-stopped
    profiles: ["whisper"]
    ports:
      - "127.0.0.1:${WHISPER_PORT:-8000}:8000"
    networks:
      - daedalus

  # OneCLI credential gateway — part of the stack. daedalus reaches it by service
  # name (http://onecli:10254). Set `onecli.baseUrl: http://onecli:10254` +
  # onecli.enabled in your config (dae install does this when you supply a key) and
  # put the daemon API key in ONECLI_API_KEY in .env. The loopback publish lets the
  # host (`dae setup onecli`) reach it too.
  onecli:
    image: ${ONECLI_IMAGE:-ghcr.io/onecli/onecli:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:10254:10254"
      - "127.0.0.1:10255:10255"
    environment:
      DATABASE_URL: postgresql://onecli:onecli@onecli-db:5432/onecli
    depends_on:
      onecli-db:
        condition: service_started
    networks:
      - daedalus

  onecli-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: onecli
      POSTGRES_PASSWORD: onecli
      POSTGRES_DB: onecli
    volumes:
      - onecli-pgdata:/var/lib/postgresql
    networks:
      - daedalus

volumes:
  daedalus-data:
  daedalus-shared:
  mempalace-data:
  # Holds the injectable agent runtime (node binary + daedalus install).
  # Populated by dae-runtime-init at startup; mounted ro into every per-agent
  # container so they don't need Node/daedalus pre-installed.
  dae-runtime:
  onecli-pgdata:

networks:
  daedalus:
    name: daedalus
    driver: bridge
