<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daedalus</title>
<!-- Favicon: an inline SVG of a square-spiral labyrinth (Daedalus built the Labyrinth),
     in the UI accent teal. Inlined as a data URI so the UI stays a single self-contained file. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0c10'/%3E%3Cpath d='M5 27V5H27V27H10V10H22V22H16' fill='none' stroke='%232dd4bf' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
/*__DAE_STYLES__*/
</style>
</head>
<body>
  <div id="sb-scrim"></div>
  <aside id="sidebar">
    <div class="sb-brand">
      <svg viewBox="0 0 32 32" width="18" height="18" aria-hidden="true"><path d="M5 27V5H27V27H10V10H22V22H16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <b>DAEDALUS</b>
    </div>
    <div class="sb-head"><button id="new-convo" type="button">＋ New session</button></div>
    <div class="sb-search"><input id="convo-search" type="search" placeholder="Search sessions…" autocomplete="off" /></div>
    <div id="convo-list"></div>
    <div class="sb-foot" id="sb-channels"></div>
  </aside>
  <div id="main">
  <header>
    <button id="sb-toggle" class="icon-btn" title="Conversations">☰</button>
    <b id="convo-title">Daedalus</b><span class="meta" id="status">connecting…</span>
    <span class="sp"></span>
    <button id="select" class="icon-btn" title="Select messages to copy (with who-said-what + timestamps)">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.2 6.2 5.8 7.8 8.6 4.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.5 5.5v6a3 3 0 0 1-3 3h-6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <button id="notify" class="icon-btn" title="Notify me when a reply lands and this tab isn't focused">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 2a4 4 0 0 0-4 4v2.5L2.8 11h10.4L12 8.5V6a4 4 0 0 0-4-4Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6.5 13a1.6 1.6 0 0 0 3 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <button id="gear" class="icon-btn" title="Settings">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.8v1.7M8 12.5v1.7M1.8 8h1.7M12.5 8h1.7M3.6 3.6l1.2 1.2M11.2 11.2l1.2 1.2M12.4 3.6l-1.2 1.2M4.8 11.2l-1.2 1.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <button id="logout" class="icon-btn" style="display:none" title="Log out">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M6 2H3.5A1.5 1.5 0 0 0 2 3.5v9A1.5 1.5 0 0 0 3.5 14H6M10.5 11 13.5 8l-3-3M13.5 8H6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>
  <div id="selbar">
    <button id="sel-cancel" type="button">Cancel</button>
    <span class="meta" id="sel-count">0 selected</span>
    <span class="sp"></span>
    <button id="sel-all" type="button">Select all</button>
    <button id="sel-copy" type="button">📋 Copy</button>
  </div>
  <div id="settings">
    <label>Bearer token (if your server requires one)</label>
    <input id="token" type="password" placeholder="leave blank if none" style="min-width:240px" />
    <button id="save">save</button>
    <span class="meta" id="uid"></span>
  </div>
  <div id="log"><div class="empty">No messages yet. Say hello.</div></div>
  <button id="new-pill" type="button">↓ new messages</button>
  <footer>
    <div id="cmd-menu"></div>
    <div id="chips"></div>
    <div class="row">
      <textarea id="text" rows="1" placeholder="Describe what you need…  (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="exec-toggle" type="button" style="display:none"
              title="Where this conversation's commands run: your machine (via dae remote) or the server">⌁ local</button>
      <label class="attach" title="Attach files">📎<input id="file" type="file" multiple hidden /></label>
      <button id="send">Send</button>
    </div>
  </footer>
  </div>
  <!-- Hermes-style status bar: supervisor state on the left (gateway / agents / cron),
       session metrics on the right (context window fill, session timer, versions). -->
  <!-- The agents/cron items are BUTTONS: clicking opens an anchored popover with the
       live detail (agents + what they're doing right now; schedules + next fires). -->
  <div id="popover" style="display:none">
    <div class="pop-head"><span id="pop-title"></span><button id="pop-close" type="button" title="Close">✕</button></div>
    <div class="pop-body" id="pop-body"></div>
  </div>
  <div id="statusbar">
    <span class="st-item"><i class="dot" id="st-gw-dot"></i><span id="st-gw">Gateway</span></span>
    <button class="st-item st-btn" id="st-agents" title="Agents — click for live activity"><i class="live-dot" id="activity-dot"></i><b id="st-agents-n">–</b> agents<span id="st-active-n"></span></button>
    <button class="st-item st-btn" id="st-cron" title="Schedules — click for detail">◷ <b id="st-cron-n">–</b> cron</button>
    <span class="sp"></span>
    <span class="st-item" id="st-context" title="context window used (last turn)" style="display:none">
      <span id="st-ctx-text"></span><span class="ctx-track"><i id="st-ctx-fill"></i></span><span id="st-ctx-pct"></span>
    </span>
    <span class="st-item" title="time since this page opened">Session <span id="st-session">0:00</span></span>
    <span class="st-item" id="st-versions"><span title="UI version baked into this page">client __DAE_CLIENT_VERSION__</span> · <span id="st-backend" title="server version">backend –</span></span>
  </div>
<!-- Markdown rendering + HTML sanitizing. Served locally by the daedalus server
     (see web.ts) so the UI keeps working offline with no third-party requests. -->
<script src="/vendor/purify.min.js"></script>
<script src="/vendor/marked.umd.js"></script>
<script>
/*__DAE_APP_JS__*/
</script>
</body>
</html>
